name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Upgrade packaging installer
        # pip-audit 会审计当前环境，先更新 runner 自带打包工具，避免已修复漏洞污染 SDK 审计结论。
        run: python -m pip install --upgrade pip "setuptools>=83"
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Check generated files
        run: python scripts/generate.py --check
      - name: Check documentation
        run: python scripts/check_docs.py
      - name: Check public repository boundary
        run: python scripts/check_public.py
      - name: Check format
        run: ruff format --check .
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy --strict src scripts typing_tests
      - name: Check PEP 728 public typing
        # mypy 2.3 尚未实现 extra_items；Pyright gate 验证 open ProviderProfile 的标准语义。
        run: npx --yes pyright@1.1.411 pyright_tests
      - name: Test
        run: pytest
      - name: Audit dependencies
        run: pip-audit

  compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: pytest

  node-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: python-sdk
      - uses: actions/checkout@v7
        with:
          repository: Unify-Port/UnifyPort-SDK-Nodejs
          # 固定已审查源码；先推送 Node 提交再运行此门禁，不将源码当作已发布包。
          ref: ce60499d7169c860ed3f64a686e04bff44316f35
          fetch-depth: 0
          path: node-sdk
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: python-sdk/pyproject.toml
      - name: Install parity dependencies
        working-directory: python-sdk
        run: python -m pip install -e ".[dev]"
      - name: Verify frozen Node baseline
        working-directory: python-sdk
        # 独立 checkout 防止本仓库相对路径或本机状态掩盖 upstream drift。
        run: python scripts/check_node_parity.py --node-repo ../node-sdk --node-ref ce60499d7169c860ed3f64a686e04bff44316f35

  package:
    needs: [quality, compatibility, node-parity]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install build tools
        run: python -m pip install -e ".[dev]"
      - name: Build distributions
        run: python -m build
      - name: Check distributions
        run: twine check dist/*
      - name: Inspect public artifacts
        run: python scripts/check_public.py dist/*
      - name: Create clean wheel environment
        # 独立 venv 避免 editable source checkout 掩盖 wheel 的缺失文件或 metadata 问题。
        run: python -m venv /tmp/unifyport-sdk-wheel-venv
      - name: Install built wheel
        run: /tmp/unifyport-sdk-wheel-venv/bin/python -m pip install dist/*.whl
      - name: Smoke test installed wheel
        run: /tmp/unifyport-sdk-wheel-venv/bin/python scripts/smoke_installed.py
      - uses: actions/upload-artifact@v4
        with:
          name: unifyport-sdk-dist
          path: dist/*
          if-no-files-found: error
