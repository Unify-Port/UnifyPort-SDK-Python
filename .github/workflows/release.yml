name: Release

on:
  push:
    tags:
      - "v*"

# 同一版本不能覆盖上传，禁止自动取消已进入 registry publish 的 release run。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Validate and build distributions
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.package-version.outputs.value }}
    steps:
      # release job 具有供应链影响，固定第三方 action SHA，避免浮动 tag 在无审查时改变行为。
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: Unify-Port/UnifyPort-SDK-Nodejs
          ref: v0.4.0
          fetch-depth: 0
          path: node-sdk
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Upgrade audited packaging tools
        # pip-audit 会检查 runner 环境，先升级已知修复版本，避免基础镜像工具链污染 SDK 结论。
        run: python -m pip install --upgrade pip "setuptools>=83"
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Read package version
        id: package-version
        run: echo "value=$(python -c 'import unifyport; print(unifyport.__version__)')" >> "$GITHUB_OUTPUT"
      - name: Match tag to package version
        # tag 与 wheel metadata 不一致会留下无法修正的 registry 版本，因此在 build 前立即失败。
        env:
          PACKAGE_VERSION: ${{ steps.package-version.outputs.value }}
        run: test "$GITHUB_REF_NAME" = "v$PACKAGE_VERSION"
      - name: Check generated files
        run: python scripts/generate.py --check
      - name: Check Node contract parity
        run: python scripts/check_node_parity.py --node-repo node-sdk --node-ref v0.4.0
      - name: Check documentation
        run: python scripts/check_docs.py
      - name: Check public repository boundary
        run: python scripts/check_public.py
      - name: Check format
        run: ruff format --check .
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy --strict src scripts typing_tests
      - name: Check PEP 728 public typing
        run: npx --yes pyright@1.1.411 pyright_tests
      - name: Test
        run: pytest
      - name: Audit dependencies
        run: pip-audit
      - name: Build distributions
        run: python -m build
      - name: Check distributions
        run: twine check dist/*
      - name: Inspect public artifacts
        run: python scripts/check_public.py dist/*
      - name: Install wheel in a clean environment
        run: |
          python -m venv /tmp/unifyport-release-wheel-venv
          /tmp/unifyport-release-wheel-venv/bin/python -m pip install dist/*.whl
          /tmp/unifyport-release-wheel-venv/bin/python scripts/smoke_installed.py
      - name: Print distribution checksums
        run: sha256sum dist/*
      - name: Store distributions
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: unifyport-sdk-dist-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 90

  publish-pypi:
    name: Publish to PyPI
    # 用户确认首发跳过 TestPyPI；仍由 build 全门禁与 pypi environment 审批保护正式发布。
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/unifyport-sdk
    permissions:
      id-token: write
    steps:
      # production publish 只接收同一 run 的 build 验收 artifact，并由 pypi environment 提供人工审批门禁。
      - name: Download distributions
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: unifyport-sdk-dist-${{ github.ref_name }}
          path: dist/
      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          print-hash: true

  verify-pypi:
    name: Verify PyPI installation
    needs: [build, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - name: Install exact PyPI version
        env:
          PACKAGE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          python -m venv /tmp/unifyport-pypi-venv
          for attempt in {1..12}; do
            if /tmp/unifyport-pypi-venv/bin/python -m pip install \
              --index-url https://pypi.org/simple/ "unifyport-sdk==$PACKAGE_VERSION"; then
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              exit 1
            fi
            sleep 10
          done
      - name: Smoke test PyPI installation
        run: /tmp/unifyport-pypi-venv/bin/python scripts/smoke_installed.py
